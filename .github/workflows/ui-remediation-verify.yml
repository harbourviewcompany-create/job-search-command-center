name: UI Remediation Verify

on:
  push:
    branches:
      - internal-ui-remediation-20260731
    paths-ignore:
      - docs/verification/UI_REMEDIATION_CI.md
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ui-verification-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ui-verification-placeholder
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Synchronize lockfile and install dependencies
        id: install
        shell: bash
        run: |
          set +e
          {
            echo '$ npm install --package-lock-only --ignore-scripts --no-audit --no-fund'
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            lock_code=$?
            echo
            echo '$ npm ci --no-audit --no-fund'
            if [ "$lock_code" = "0" ]; then
              npm ci --no-audit --no-fund
              ci_code=$?
            else
              echo 'Lockfile synchronization failed; npm ci skipped.'
              ci_code=125
            fi
          } > /tmp/install.log 2>&1
          if [ "$lock_code" != "0" ]; then
            code=$lock_code
          else
            code=$ci_code
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          tail -n 100 /tmp/install.log
          exit 0

      - name: Typecheck
        id: typecheck
        shell: bash
        run: |
          if [ "${{ steps.install.outputs.exit_code }}" != "0" ]; then
            echo "Dependency installation failed; typecheck skipped." | tee /tmp/typecheck.log
            echo "exit_code=125" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          npm run typecheck > /tmp/typecheck.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat /tmp/typecheck.log
          exit 0

      - name: Lint
        id: lint
        shell: bash
        run: |
          if [ "${{ steps.install.outputs.exit_code }}" != "0" ]; then
            echo "Dependency installation failed; lint skipped." | tee /tmp/lint.log
            echo "exit_code=125" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          npm run lint > /tmp/lint.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat /tmp/lint.log
          exit 0

      - name: Unit tests
        id: tests
        shell: bash
        run: |
          if [ "${{ steps.install.outputs.exit_code }}" != "0" ]; then
            echo "Dependency installation failed; tests skipped." | tee /tmp/tests.log
            echo "exit_code=125" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          npm test > /tmp/tests.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat /tmp/tests.log
          exit 0

      - name: Production build
        id: build
        shell: bash
        run: |
          if [ "${{ steps.install.outputs.exit_code }}" != "0" ]; then
            echo "Dependency installation failed; build skipped." | tee /tmp/build.log
            echo "exit_code=125" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          npm run build > /tmp/build.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat /tmp/build.log
          exit 0

      - name: Write verification report
        if: always()
        shell: bash
        run: |
          mkdir -p docs/verification
          {
            echo "# UI Remediation CI Verification"
            echo
            echo "- Source commit: \`${GITHUB_SHA}\`"
            echo "- Workflow run: \`${GITHUB_RUN_ID}\`"
            echo "- Event: \`${GITHUB_EVENT_NAME}\`"
            echo "- Generated: \`$(date -u +'%Y-%m-%dT%H:%M:%SZ')\`"
            echo
            echo "| Check | Exit code |"
            echo "|---|---:|"
            echo "| lockfile sync + npm ci | ${{ steps.install.outputs.exit_code }} |"
            echo "| npm run typecheck | ${{ steps.typecheck.outputs.exit_code }} |"
            echo "| npm run lint | ${{ steps.lint.outputs.exit_code }} |"
            echo "| npm test | ${{ steps.tests.outputs.exit_code }} |"
            echo "| npm run build | ${{ steps.build.outputs.exit_code }} |"
            echo
            for entry in install typecheck lint tests build; do
              echo "## ${entry} log tail"
              echo
              echo '```text'
              tail -n 60 "/tmp/${entry}.log" 2>/dev/null || true
              echo '```'
              echo
            done
          } > docs/verification/UI_REMEDIATION_CI.md

      - name: Commit verification evidence to review branch
        if: always() && github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json docs/verification/UI_REMEDIATION_CI.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: synchronize lockfile and record verification [skip ci]"
            git push origin "HEAD:internal-ui-remediation-20260731"
          fi

      - name: Enforce verification gate
        if: always()
        shell: bash
        run: |
          codes=(
            "${{ steps.install.outputs.exit_code }}"
            "${{ steps.typecheck.outputs.exit_code }}"
            "${{ steps.lint.outputs.exit_code }}"
            "${{ steps.tests.outputs.exit_code }}"
            "${{ steps.build.outputs.exit_code }}"
          )
          for code in "${codes[@]}"; do
            if [ -z "$code" ] || [ "$code" != "0" ]; then
              exit 1
            fi
          done
