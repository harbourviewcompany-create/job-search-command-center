name: UI Remediation Verify

on:
  push:
    branches:
      - internal-ui-remediation-20260731

permissions:
  contents: write

concurrency:
  group: ui-remediation-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Apply and verify PR8 remediation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ui-verification-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ui-verification-placeholder
      JOB_PULL_API_KEY: ui-verification-placeholder-with-sufficient-length
      OPERATOR_USER_ID: 00000000-0000-0000-0000-000000000001
      OPERATOR_EMAIL: operator@example.com
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true

      - name: Apply scoped remediation
        run: python3 scripts/remediate-pr8.py

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run lint
          npm test
          npm run build

      - name: Commit verified remediation and restore workflow
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD^:.github/workflows/ui-remediation-verify.yml > .github/workflows/ui-remediation-verify.yml
          git rm scripts/remediate-pr8.py
          git add -A
          git config user.name "harbourviewcompany-create"
          git config user.email "231706713+harbourviewcompany-create@users.noreply.github.com"
          git commit -m "fix: close PR8 pre-merge security blockers"
          git push origin HEAD:internal-ui-remediation-20260731
