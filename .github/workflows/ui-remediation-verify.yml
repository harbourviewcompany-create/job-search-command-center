name: UI Remediation Verify

on:
  push:
    branches:
      - feat/job-discovery-v2

permissions:
  contents: write

concurrency:
  group: apply-v2-database-remediation
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Apply database remediation
        run: python3 scripts/apply-v2-database-remediation.py
      - name: Restore workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git show f3ff18ed7d88b210ad166d363f31e4c446197ccc:.github/workflows/ui-remediation-verify.yml > .github/workflows/ui-remediation-verify.yml
          git rm scripts/apply-v2-database-remediation.py
          git add -A
          git config user.name "harbourviewcompany-create"
          git config user.email "231706713+harbourviewcompany-create@users.noreply.github.com"
          git commit -m "fix: harden discovery database lifecycle"
          git push origin HEAD:feat/job-discovery-v2
