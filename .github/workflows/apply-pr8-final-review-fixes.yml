name: Apply PR 8 Final Review Fixes

on:
  push:
    branches:
      - maintenance/pr8-operator-boundary
    paths:
      - .github/workflows/apply-pr8-final-review-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: internal-ui-remediation-20260731

      - name: Apply reviewed fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # Keep generated effective timestamp represented in read types only.
          types = Path('src/types/database.ts')
          text = types.read_text()
          old = """          posted_at: string | null
          fetched_at: string
          status: JobStatus
"""
          new = """          posted_at: string | null
          fetched_at: string
          effective_at: string
          status: JobStatus
"""
          if old not in text:
              raise SystemExit('database Row timestamp block not found')
          types.write_text(text.replace(old, new, 1))

          # Bound company expansion and derived retrieval; use the generated
          # effective timestamp for database-side newest/oldest pagination.
          jobs = Path('src/app/jobs/page.tsx')
          text = jobs.read_text()
          replacements = [
            (
              "const DATABASE_BATCH_SIZE = 1000\n",
              "const DATABASE_BATCH_SIZE = 1000\nconst COMPANY_MATCH_LIMIT = 100\nconst DERIVED_ROW_LIMIT = 5000\n",
            ),
            (
              """  if (patterns.length === 0) return { ids: [] as string[], error: null as string | null }

  const supabase = await createClient()
  let companyQuery = supabase.from('companies').select('id').limit(5000)
""",
              """  if (patterns.length === 0) {
    return { ids: [] as string[], error: null as string | null, truncated: false }
  }

  const supabase = await createClient()
  let companyQuery = supabase
    .from('companies')
    .select('id')
    .limit(COMPANY_MATCH_LIMIT + 1)
""",
            ),
            (
              """  const { data, error } = await companyQuery
  return {
    ids: (data ?? []).map((company) => company.id),
    error: error?.message ?? null,
  }
}

function applyDatabaseOrder<T extends {
  order: (column: string, options?: { ascending?: boolean; nullsFirst?: boolean }) => T
}>(query: T) {
  return query
    .order('fit_score', { ascending: false, nullsFirst: false })
    .order('posted_at', { ascending: false, nullsFirst: false })
    .order('fetched_at', { ascending: false })
    .order('id', { ascending: true })
}
""",
              """  const { data, error } = await companyQuery
  const ids = (data ?? []).map((company) => company.id)
  const truncated = ids.length > COMPANY_MATCH_LIMIT
  return {
    ids: ids.slice(0, COMPANY_MATCH_LIMIT),
    error:
      error?.message ??
      (truncated
        ? `Company-name search exceeded ${COMPANY_MATCH_LIMIT} matches; refine the query for complete results.`
        : null),
    truncated,
  }
}

function applyDatabaseOrder<T extends {
  order: (column: string, options?: { ascending?: boolean; nullsFirst?: boolean }) => T
}>(query: T, sort: JobSort) {
  if (sort === 'newest') {
    return query
      .order('effective_at', { ascending: false, nullsFirst: false })
      .order('id', { ascending: true })
  }
  if (sort === 'oldest') {
    return query
      .order('effective_at', { ascending: true, nullsFirst: false })
      .order('id', { ascending: true })
  }
  return query
    .order('fit_score', { ascending: false, nullsFirst: false })
    .order('effective_at', { ascending: false, nullsFirst: false })
    .order('id', { ascending: true })
}
""",
            ),
            (
              """  const from = (page - 1) * pageSize
  const { data, error } = await applyDatabaseOrder(dataQuery)
    .range(from, from + pageSize - 1)

  return {
    rows: error ? [] : ((data ?? []) as JobWithCompany[]),
    total,
    page,
    totalPages,
    error: error?.message ?? null,
  }
}
""",
              """  const from = (page - 1) * pageSize
  const { data, error } = await applyDatabaseOrder(dataQuery, filters.sort)
    .range(from, from + pageSize - 1)

  if (error) {
    return {
      rows: [] as JobWithCompany[],
      total: 0,
      page: 1,
      totalPages: 1,
      error: error.message,
    }
  }

  return {
    rows: (data ?? []) as JobWithCompany[],
    total,
    page,
    totalPages,
    error: null as string | null,
  }
}
""",
            ),
            (
              """  const rows: JobWithCompany[] = []
  const clauses = jobSearchClauses(searchPatterns(filters.query), companyIds)

  for (let from = 0; ; from += DATABASE_BATCH_SIZE) {
""",
              """  const rows: JobWithCompany[] = []
  const clauses = jobSearchClauses(searchPatterns(filters.query), companyIds)

  let countQuery = supabase
    .from('jobs')
    .select('id', { count: 'exact', head: true })
    .in('status', statusValues(filters))
  if (filters.source !== 'all') countQuery = countQuery.eq('source', filters.source)
  if (clauses.length > 0) countQuery = countQuery.or(clauses.join(','))

  const { count: candidateCount, error: countError } = await countQuery
  if (countError) {
    return {
      rows: [] as JobWithCompany[],
      total: 0,
      page: 1,
      totalPages: 1,
      error: countError.message,
    }
  }
  if ((candidateCount ?? 0) > DERIVED_ROW_LIMIT) {
    return {
      rows: [] as JobWithCompany[],
      total: 0,
      page: 1,
      totalPages: 1,
      error: `This computed filter matches more than ${DERIVED_ROW_LIMIT} jobs. Refine the filters before sorting by company or arrangement.`,
    }
  }

  for (let from = 0; from < (candidateCount ?? 0); from += DATABASE_BATCH_SIZE) {
""",
            ),
            (
              """  const usesDerivedDatabaseFields =
    filters.arrangement !== 'all' ||
    filters.sort === 'company' ||
    filters.sort === 'newest' ||
    filters.sort === 'oldest'
""",
              """  const usesDerivedDatabaseFields =
    filters.arrangement !== 'all' || filters.sort === 'company'
""",
            ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'jobs page block not found: {old[:100]!r}')
              text = text.replace(old, new, 1)
          jobs.write_text(text)

          # Exercise the real operator cookie in browser verification instead
          # of relying on an environment-driven mutation bypass.
          harness = Path('tests/runtime-browser-verification-v3.mjs')
          text = harness.read_text()
          old = """async function verifyPullAuthorization(page) {
  const unauthorized = await page.request.post(`${baseUrl}/api/jobs/pull`)
  assert.equal(unauthorized.status(), 401)

  const authorized = await page.request.post(`${baseUrl}/api/jobs/pull`, {
    headers: { Authorization: `Bearer ${serviceKey}` },
    timeout: 45_000,
  })
  assert.equal(authorized.status(), 200, await authorized.text())
  const payload = await authorized.json()
  assert(payload.ok !== false)

  const button = page.getByRole('button', { name: 'Pull latest jobs', exact: true })
  assert.equal(await button.isDisabled(), true)
  await page.getByText('An authenticated Supabase session is required for manual pulls.').waitFor()
  return payload
}
"""
          new = """async function verifyPullAuthorization(page) {
  const unauthorized = await page.request.post(`${baseUrl}/api/jobs/pull`)
  assert.equal(unauthorized.status(), 401)

  const button = page.getByRole('button', { name: 'Pull latest jobs', exact: true })
  assert.equal(await button.isDisabled(), true)
  await page.getByText('An authenticated Supabase session is required for manual pulls.').waitFor()

  await page.getByLabel('Operator access key').fill(serviceKey)
  await page.getByRole('button', { name: 'Unlock operator', exact: true }).click()
  await page.getByText('Operator access unlocked for this browser.', { exact: true }).waitFor()
  await page.getByRole('button', { name: 'Pull latest jobs', exact: true }).waitFor()
  assert.equal(await page.getByRole('button', { name: 'Pull latest jobs', exact: true }).isEnabled(), true)

  const cookieAuthorized = await page.request.head(`${baseUrl}/api/jobs/pull`)
  assert.equal(cookieAuthorized.status(), 204)

  const authorized = await page.request.post(`${baseUrl}/api/jobs/pull`, {
    headers: { Authorization: `Bearer ${serviceKey}` },
    timeout: 45_000,
  })
  assert.equal(authorized.status(), 200, await authorized.text())
  const payload = await authorized.json()
  assert(payload.ok !== false)
  return payload
}
"""
          if old not in text:
              raise SystemExit('verifyPullAuthorization block not found')
          text = text.replace(old, new, 1)
          old = """    await verify('Server-wide search, filters, and sorts', () => verifyFiltersAndSorts(page, fixtureIds.betaTitle))
    await verify('Manual add refreshes existing state', () => verifyAddJobRefresh(page))
    await verify('Job/application status lifecycle', () => verifyStatusLifecycle(page, fixtureIds.alphaJobId))
    await verify('Job-pull authorization and service flow', () => verifyPullAuthorization(page))
"""
          new = """    await verify('Server-wide search, filters, and sorts', () => verifyFiltersAndSorts(page, fixtureIds.betaTitle))
    await verify('Job-pull authorization and operator unlock flow', () => verifyPullAuthorization(page))
    await verify('Manual add refreshes existing state', () => verifyAddJobRefresh(page))
    await verify('Job/application status lifecycle', () => verifyStatusLifecycle(page, fixtureIds.alphaJobId))
"""
          if old not in text:
              raise SystemExit('functional verification order block not found')
          harness.write_text(text.replace(old, new, 1))
          PY

      - name: Commit patches to PR branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/types/database.ts src/app/jobs/page.tsx tests/runtime-browser-verification-v3.mjs
          git commit -m "fix: close final pagination and authorization findings"
          git push origin HEAD:internal-ui-remediation-20260731
