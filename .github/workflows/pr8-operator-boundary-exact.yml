name: PR 8 Operator Boundary Exact-Head Verify

on:
  push:
    branches:
      - maintenance/pr8-operator-boundary
    paths:
      - .github/workflows/pr8-operator-boundary-exact.yml

permissions:
  contents: write

concurrency:
  group: pr8-operator-boundary-exact-head
  cancel-in-progress: true

jobs:
  verify:
    name: Verify exact PR head with connected Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      SOURCE_SHA: 93f6a0881df10b34240daeeb8ddaa7d06fe0d3b5
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.RUNTIME_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL || vars.RUNTIME_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.RUNTIME_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || vars.RUNTIME_SUPABASE_ANON_KEY || vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.RUNTIME_SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
      JOB_PULL_API_KEY: runtime-local-pr8-boundary-${{ github.run_id }}-${{ github.run_attempt }}
      JOBS_PAGE_SIZE: 25
      RUNTIME_RUN_TOKEN: pr8-boundary-${{ github.run_id }}-${{ github.run_attempt }}
      RUNTIME_BASE_URL: http://127.0.0.1:3000
      RUNTIME_EVIDENCE_DIR: qa/pr8-operator-boundary

    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@v4
        with:
          ref: 93f6a0881df10b34240daeeb8ddaa7d06fe0d3b5
          path: source
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Execute complete exact-head verification
        working-directory: source
        shell: bash
        run: |
          set +e
          mkdir -p "$RUNTIME_EVIDENCE_DIR"

          test -n "$NEXT_PUBLIC_SUPABASE_URL" && test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" && test -n "$SUPABASE_SERVICE_ROLE_KEY"
          credentials=$?

          npm ci --no-audit --no-fund > "$RUNTIME_EVIDENCE_DIR/npm-ci.log" 2>&1
          npm_ci=$?
          npm run typecheck > "$RUNTIME_EVIDENCE_DIR/typecheck.log" 2>&1
          typecheck=$?
          npm run lint > "$RUNTIME_EVIDENCE_DIR/lint.log" 2>&1
          lint=$?
          npm test > "$RUNTIME_EVIDENCE_DIR/tests.log" 2>&1
          tests=$?
          npm run build > "$RUNTIME_EVIDENCE_DIR/build.log" 2>&1
          build=$?

          boundary=1
          browser_package=1
          browser_install=1
          server=1
          runtime=1
          focused=1
          cleanup=1

          if [ "$credentials" -eq 0 ] && [ "$npm_ci" -eq 0 ]; then
            node tests/operator-boundary-verification.mjs > "$RUNTIME_EVIDENCE_DIR/operator-boundary.log" 2>&1
            boundary=$?
            npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.54.1 > "$RUNTIME_EVIDENCE_DIR/playwright-package.log" 2>&1
            browser_package=$?
            npx playwright@1.54.1 install --with-deps chromium webkit > "$RUNTIME_EVIDENCE_DIR/playwright-install.log" 2>&1
            browser_install=$?
          fi

          if [ "$build" -eq 0 ] && [ "$boundary" -eq 0 ] && [ "$browser_package" -eq 0 ] && [ "$browser_install" -eq 0 ]; then
            npm run start -- --hostname 127.0.0.1 --port 3000 > "$RUNTIME_EVIDENCE_DIR/server.log" 2>&1 &
            server_pid=$!
            echo "$server_pid" > "$RUNTIME_EVIDENCE_DIR/server.pid"
            for attempt in $(seq 1 90); do
              if curl --fail --silent "$RUNTIME_BASE_URL/jobs" >/dev/null; then
                server=0
                break
              fi
              sleep 1
            done

            if [ "$server" -eq 0 ]; then
              GITHUB_SHA="$SOURCE_SHA" node tests/runtime-browser-verification.mjs > "$RUNTIME_EVIDENCE_DIR/runtime.log" 2>&1
              runtime=$?
              GITHUB_SHA="$SOURCE_SHA" node tests/review-fix-browser-verification.mjs > "$RUNTIME_EVIDENCE_DIR/focused.log" 2>&1
              focused=$?
            fi

            node tests/runtime-browser-cleanup-service.mjs > "$RUNTIME_EVIDENCE_DIR/cleanup.log" 2>&1
            cleanup=$?
            kill "$server_pid" 2>/dev/null || true
          elif [ "$credentials" -eq 0 ]; then
            node tests/runtime-browser-cleanup-service.mjs > "$RUNTIME_EVIDENCE_DIR/cleanup.log" 2>&1
            cleanup=$?
          fi

          jq -n \
            --arg source "$SOURCE_SHA" \
            --arg run "$GITHUB_RUN_ID" \
            --argjson credentials "$credentials" \
            --argjson npmCi "$npm_ci" \
            --argjson typecheck "$typecheck" \
            --argjson lint "$lint" \
            --argjson tests "$tests" \
            --argjson build "$build" \
            --argjson boundary "$boundary" \
            --argjson browserPackage "$browser_package" \
            --argjson browserInstall "$browser_install" \
            --argjson server "$server" \
            --argjson runtime "$runtime" \
            --argjson focused "$focused" \
            --argjson cleanup "$cleanup" \
            '{sourceSha:$source,workflowRun:$run,exitCodes:{credentials:$credentials,npmCi:$npmCi,typecheck:$typecheck,lint:$lint,tests:$tests,build:$build,operatorBoundary:$boundary,browserPackage:$browserPackage,browserInstall:$browserInstall,server:$server,runtime:$runtime,focused:$focused,cleanup:$cleanup},mergePerformed:false,productionDeploymentPerformed:false}' \
            > "$RUNTIME_EVIDENCE_DIR/command-results.json"

          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('qa/pr8-operator-boundary')
          summary = json.loads((root / 'command-results.json').read_text())

          def load_json(name):
              path = root / name
              return json.loads(path.read_text()) if path.exists() else None

          runtime = load_json('runtime-browser-evidence.json')
          focused = load_json('review-fix-browser-evidence.json')
          boundary = load_json('operator-boundary-evidence.json')
          codes = summary['exitCodes']
          summary['runtimeSummary'] = runtime.get('summary') if runtime else None
          focused_checks = focused.get('checks', []) if focused else []
          summary['focusedSummary'] = {
              'total': len(focused_checks),
              'passed': sum(1 for check in focused_checks if check.get('passed')),
              'failed': sum(1 for check in focused_checks if not check.get('passed')),
          } if focused else None
          boundary_checks = boundary.get('checks', []) if boundary else []
          summary['operatorBoundarySummary'] = {
              'total': len(boundary_checks),
              'passed': sum(1 for check in boundary_checks if check.get('passed')),
              'failed': sum(1 for check in boundary_checks if not check.get('passed')),
          } if boundary else None
          cleanup = (root / 'cleanup.log').read_text(errors='replace') if (root / 'cleanup.log').exists() else ''
          summary['cleanupTail'] = cleanup[-1200:]
          summary['finalGo'] = (
              all(code == 0 for code in codes.values())
              and summary['runtimeSummary'] is not None
              and summary['runtimeSummary'].get('failed') == 0
              and summary['focusedSummary'] is not None
              and summary['focusedSummary'].get('failed') == 0
              and summary['operatorBoundarySummary'] is not None
              and summary['operatorBoundarySummary'].get('failed') == 0
          )
          (root / 'summary.json').write_text(json.dumps(summary, indent=2))
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr8-operator-boundary-exact-${{ github.run_id }}
          path: source/qa/pr8-operator-boundary
          if-no-files-found: error
          retention-days: 14

      - name: Checkout evidence branch
        if: always()
        uses: actions/checkout@v4
        with:
          ref: maintenance/pr8-operator-boundary
          path: report

      - name: Persist summary on deployment-disabled helper branch
        if: always()
        shell: bash
        run: |
          mkdir -p report/verification-output/pr8-operator-boundary
          cp source/qa/pr8-operator-boundary/summary.json report/verification-output/pr8-operator-boundary/
          cp source/qa/pr8-operator-boundary/operator-boundary-evidence.json report/verification-output/pr8-operator-boundary/ 2>/dev/null || true
          cp source/qa/pr8-operator-boundary/runtime-browser-evidence.json report/verification-output/pr8-operator-boundary/ 2>/dev/null || true
          cp source/qa/pr8-operator-boundary/review-fix-browser-evidence.json report/verification-output/pr8-operator-boundary/ 2>/dev/null || true
          cp source/qa/pr8-operator-boundary/cleanup.log report/verification-output/pr8-operator-boundary/ 2>/dev/null || true
          cd report
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verification-output/pr8-operator-boundary
          git commit -m "test: record PR 8 operator-boundary exact-head verification" || true
          git push origin HEAD:maintenance/pr8-operator-boundary

      - name: Enforce exact-head result
        if: always()
        working-directory: source
        shell: bash
        run: test "$(jq -r '.finalGo' "$RUNTIME_EVIDENCE_DIR/summary.json")" = "true"
