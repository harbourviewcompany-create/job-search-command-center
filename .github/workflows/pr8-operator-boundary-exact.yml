name: PR 8 Operator Boundary Exact-Head Verify

on:
  push:
    branches:
      - maintenance/pr8-operator-boundary
    paths:
      - .github/workflows/pr8-operator-boundary-exact.yml

permissions:
  contents: read

concurrency:
  group: pr8-operator-boundary-exact-head
  cancel-in-progress: false

jobs:
  verify:
    name: Verify exact PR head with connected Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      SOURCE_SHA: 93f6a0881df10b34240daeeb8ddaa7d06fe0d3b5
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.RUNTIME_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL || vars.RUNTIME_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.RUNTIME_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || vars.RUNTIME_SUPABASE_ANON_KEY || vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.RUNTIME_SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
      JOB_PULL_API_KEY: runtime-local-pr8-boundary-${{ github.run_id }}-${{ github.run_attempt }}
      JOBS_PAGE_SIZE: 25
      RUNTIME_RUN_TOKEN: pr8-boundary-${{ github.run_id }}-${{ github.run_attempt }}
      RUNTIME_BASE_URL: http://127.0.0.1:3000
      RUNTIME_EVIDENCE_DIR: qa/pr8-operator-boundary

    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@v4
        with:
          ref: 93f6a0881df10b34240daeeb8ddaa7d06fe0d3b5
          path: source
          persist-credentials: false

      - name: Validate connected credentials
        shell: bash
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install committed dependencies
        working-directory: source
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: source
        run: npm run typecheck

      - name: Lint
        working-directory: source
        run: npm run lint

      - name: Unit tests
        working-directory: source
        run: npm test

      - name: Production build
        working-directory: source
        run: npm run build

      - name: Verify database operator boundary
        working-directory: source
        run: node tests/operator-boundary-verification.mjs

      - name: Install browser runtime
        working-directory: source
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.54.1
          npx playwright@1.54.1 install --with-deps chromium webkit

      - name: Start production runtime
        working-directory: source
        shell: bash
        run: |
          mkdir -p "$RUNTIME_EVIDENCE_DIR"
          npm run start -- --hostname 127.0.0.1 --port 3000 > "$RUNTIME_EVIDENCE_DIR/server.log" 2>&1 &
          echo $! > "$RUNTIME_EVIDENCE_DIR/server.pid"
          for attempt in $(seq 1 90); do
            if curl --fail --silent "$RUNTIME_BASE_URL/jobs" >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNTIME_EVIDENCE_DIR/server.log"
          exit 1

      - name: Deterministic connected browser verification
        working-directory: source
        timeout-minutes: 35
        run: GITHUB_SHA="$SOURCE_SHA" node tests/runtime-browser-verification.mjs

      - name: Focused authorization and filter verification
        working-directory: source
        timeout-minutes: 10
        run: GITHUB_SHA="$SOURCE_SHA" node tests/review-fix-browser-verification.mjs

      - name: Independently clean runtime fixtures
        if: always()
        working-directory: source
        run: node tests/runtime-browser-cleanup-service.mjs

      - name: Stop production runtime
        if: always()
        working-directory: source
        shell: bash
        run: |
          if [ -f "$RUNTIME_EVIDENCE_DIR/server.pid" ]; then
            kill "$(cat "$RUNTIME_EVIDENCE_DIR/server.pid")" 2>/dev/null || true
          fi

      - name: Write summary
        if: always()
        working-directory: source
        shell: bash
        run: |
          mkdir -p "$RUNTIME_EVIDENCE_DIR"
          cat > "$RUNTIME_EVIDENCE_DIR/EXACT_HEAD.md" <<EOF
          # PR 8 operator-boundary exact-head verification

          - Source SHA: \`$SOURCE_SHA\`
          - Workflow run: \`${GITHUB_RUN_ID}\`
          - Merge performed: \`no\`
          - Production deployment performed: \`no\`
          EOF

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr8-operator-boundary-exact-${{ github.run_id }}
          path: source/qa/pr8-operator-boundary
          if-no-files-found: error
          retention-days: 14
