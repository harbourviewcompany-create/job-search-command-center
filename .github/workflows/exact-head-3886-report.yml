name: PR 8 Exact Head 3886 Evidence

on:
  push:
    branches:
      - verification/pr8-9097f87
    paths:
      - .github/workflows/exact-head-3886-report.yml

permissions:
  contents: write

concurrency:
  group: pr8-exact-head-3886-evidence
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      SOURCE_SHA: 3886f6b6a703cb2b605f9e7ea61a4ddc4fa3ae5f
      NEXT_PUBLIC_SUPABASE_URL: https://zvxdgdkukjrrwamdpqrg.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp2eGRnZGt1a2pycndhbWRwcXJnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyNDMxNzUsImV4cCI6MjA5MjgxOTE3NX0.MEGWEsDpJO3964Ef2G2Cbo-Q5JKT46WB1xtlXE-ue5M
      JOB_PULL_API_KEY: runtime-local-pr8-3886-report
      JOBS_PAGE_SIZE: 25
      RUNTIME_RUN_TOKEN: pr8-3886-report-${{ github.run_id }}-${{ github.run_attempt }}
      RUNTIME_BASE_URL: http://127.0.0.1:3000
      RUNTIME_EVIDENCE_DIR: qa/exact-3886
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: 3886f6b6a703cb2b605f9e7ea61a4ddc4fa3ae5f
          path: source
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Execute complete verification
        working-directory: source
        shell: bash
        run: |
          set +e
          mkdir -p "$RUNTIME_EVIDENCE_DIR"
          npm ci --no-audit --no-fund > "$RUNTIME_EVIDENCE_DIR/npm-ci.log" 2>&1; npm_ci=$?
          npm run typecheck > "$RUNTIME_EVIDENCE_DIR/typecheck.log" 2>&1; typecheck=$?
          npm run lint > "$RUNTIME_EVIDENCE_DIR/lint.log" 2>&1; lint=$?
          npm test > "$RUNTIME_EVIDENCE_DIR/tests.log" 2>&1; tests=$?
          npm run build > "$RUNTIME_EVIDENCE_DIR/build.log" 2>&1; build=$?
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.54.1 > "$RUNTIME_EVIDENCE_DIR/playwright-package.log" 2>&1; playwright_package=$?
          npx playwright@1.54.1 install --with-deps chromium webkit > "$RUNTIME_EVIDENCE_DIR/playwright-browsers.log" 2>&1; playwright_browsers=$?

          server=1; runtime=1; focused=1; cleanup=1
          if [ "$build" -eq 0 ] && [ "$playwright_package" -eq 0 ] && [ "$playwright_browsers" -eq 0 ]; then
            npm run start -- --hostname 127.0.0.1 --port 3000 > "$RUNTIME_EVIDENCE_DIR/server.log" 2>&1 &
            server_pid=$!
            for attempt in $(seq 1 90); do
              if curl --fail --silent "$RUNTIME_BASE_URL/jobs" >/dev/null; then server=0; break; fi
              sleep 1
            done
            if [ "$server" -eq 0 ]; then
              GITHUB_SHA="$SOURCE_SHA" node tests/runtime-browser-verification.mjs > "$RUNTIME_EVIDENCE_DIR/runtime.log" 2>&1; runtime=$?
              GITHUB_SHA="$SOURCE_SHA" node tests/review-fix-browser-verification.mjs > "$RUNTIME_EVIDENCE_DIR/focused.log" 2>&1; focused=$?
            fi
            node tests/runtime-browser-cleanup.mjs > "$RUNTIME_EVIDENCE_DIR/cleanup.log" 2>&1; cleanup=$?
            kill "$server_pid" 2>/dev/null || true
          else
            node tests/runtime-browser-cleanup.mjs > "$RUNTIME_EVIDENCE_DIR/cleanup.log" 2>&1; cleanup=$?
          fi

          jq -n --arg source "$SOURCE_SHA" \
            --argjson npmCi "$npm_ci" --argjson typecheck "$typecheck" --argjson lint "$lint" \
            --argjson tests "$tests" --argjson build "$build" --argjson playwrightPackage "$playwright_package" \
            --argjson playwrightBrowsers "$playwright_browsers" --argjson server "$server" \
            --argjson runtime "$runtime" --argjson focused "$focused" --argjson cleanup "$cleanup" \
            '{sourceSha:$source,exitCodes:{npmCi:$npmCi,typecheck:$typecheck,lint:$lint,tests:$tests,build:$build,playwrightPackage:$playwrightPackage,playwrightBrowsers:$playwrightBrowsers,server:$server,runtime:$runtime,focused:$focused,cleanup:$cleanup}}' > "$RUNTIME_EVIDENCE_DIR/command-results.json"

          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('qa/exact-3886')
          command=json.loads((root/'command-results.json').read_text())
          def load(name):
              path=root/name
              return json.loads(path.read_text()) if path.exists() else None
          runtime=load('runtime-browser-evidence.json')
          focused=load('review-fix-browser-evidence.json')
          runtime_summary=runtime.get('summary') if runtime else None
          checks=focused.get('checks',[]) if focused else []
          focused_summary={'total':len(checks),'passed':sum(1 for c in checks if c.get('passed')),'failed':sum(1 for c in checks if not c.get('passed'))} if focused else None
          cleanup=(root/'cleanup.log').read_text(errors='replace') if (root/'cleanup.log').exists() else ''
          go=all(code==0 for code in command['exitCodes'].values()) and runtime_summary is not None and runtime_summary.get('failed')==0 and focused_summary is not None and focused_summary.get('failed')==0
          summary={'sourceSha':command['sourceSha'],'exitCodes':command['exitCodes'],'runtimeSummary':runtime_summary,'focusedSummary':focused_summary,'cleanupTail':cleanup[-1200:],'finalGo':go,'merged':False,'productionDeployed':False}
          (root/'summary.json').write_text(json.dumps(summary,indent=2))
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr8-exact-3886-${{ github.run_id }}
          path: source/qa/exact-3886
          if-no-files-found: error
          retention-days: 14

      - name: Checkout evidence branch
        if: always()
        uses: actions/checkout@v4
        with:
          ref: verification/pr8-9097f87
          path: report

      - name: Commit durable summary
        if: always()
        shell: bash
        run: |
          mkdir -p report/verification-output/pr8-3886
          cp source/qa/exact-3886/summary.json report/verification-output/pr8-3886/
          cp source/qa/exact-3886/runtime-browser-evidence.json report/verification-output/pr8-3886/ 2>/dev/null || true
          cp source/qa/exact-3886/review-fix-browser-evidence.json report/verification-output/pr8-3886/ 2>/dev/null || true
          cp source/qa/exact-3886/cleanup.log report/verification-output/pr8-3886/ 2>/dev/null || true
          cd report
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verification-output/pr8-3886
          git commit -m "test: record PR 8 head 3886 verification" || true
          git push origin HEAD:verification/pr8-9097f87

      - name: Enforce result
        if: always()
        working-directory: source
        shell: bash
        run: test "$(jq -r '.finalGo' "$RUNTIME_EVIDENCE_DIR/summary.json")" = "true"
