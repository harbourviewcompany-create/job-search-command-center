name: Job Discovery V2 Pre-Merge Remediation

on:
  push:
    branches:
      - feat/job-discovery-v2

permissions:
  contents: write

concurrency:
  group: job-discovery-v2-premerge-remediation
  cancel-in-progress: false

jobs:
  remediate:
    name: Reconcile PR8, remediate V2, verify, and commit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: discovery-verification-placeholder
      SUPABASE_SERVICE_ROLE_KEY: discovery-verification-placeholder
      JOB_PULL_API_KEY: discovery-verification-placeholder-with-sufficient-length
      OPERATOR_USER_ID: 00000000-0000-0000-0000-000000000001
      OPERATOR_EMAIL: operator@example.com
      PGPASSWORD: postgres
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: discovery_verify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d discovery_verify"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Reconcile repaired PR8 ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin internal-ui-remediation-20260731
          set +e
          git merge --no-commit --no-ff origin/internal-ui-remediation-20260731
          merge_code=$?
          set -e
          if [ "$merge_code" -ne 0 ]; then
            conflicts=$(git diff --name-only --diff-filter=U)
            if [ -z "$conflicts" ]; then
              exit "$merge_code"
            fi
            while IFS= read -r path; do
              git checkout --ours -- "$path"
              git add "$path"
            done <<< "$conflicts"
          fi

      - name: Apply complete blocker remediation
        run: python3 scripts/run-pr10-remediation.py

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install committed dependencies
        run: npm ci --no-audit --no-fund

      - name: Static verification
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build

      - name: Apply PostgreSQL 16 migration and assertion chain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa/job-discovery-v2-premerge
          psql -h 127.0.0.1 -U postgres -d discovery_verify \
            -v ON_ERROR_STOP=1 \
            -f tests/fixtures/discovery/baseline.sql \
            2>&1 | tee qa/job-discovery-v2-premerge/postgres-baseline.log
          for version in 010 011 012 013 014 015 016 017 018; do
            migration=$(find supabase/migrations -maxdepth 1 -type f -name "${version}_*.sql" -print)
            count=$(printf '%s\n' "$migration" | sed '/^$/d' | wc -l)
            if [ "$count" -ne 1 ]; then
              echo "Expected exactly one migration for ${version}; found ${count}" >&2
              exit 1
            fi
            echo "Applying ${migration}" | tee -a qa/job-discovery-v2-premerge/postgres-migrations.log
            psql -h 127.0.0.1 -U postgres -d discovery_verify \
              -v ON_ERROR_STOP=1 \
              -f "$migration" \
              2>&1 | tee -a qa/job-discovery-v2-premerge/postgres-migrations.log
          done
          psql -h 127.0.0.1 -U postgres -d discovery_verify \
            -v ON_ERROR_STOP=1 \
            -f tests/fixtures/discovery/assertions.sql \
            2>&1 | tee qa/job-discovery-v2-premerge/postgres-assertions.log
          pg_dump -h 127.0.0.1 -U postgres -d discovery_verify \
            --schema-only --schema=job_search \
            > qa/job-discovery-v2-premerge/job-search-schema.sql

      - name: Regenerate committed database types
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@2.110.0 gen types typescript \
            --db-url 'postgresql://postgres:postgres@127.0.0.1:5432/discovery_verify' \
            --schema job_search \
            > src/types/database.ts
          test -s src/types/database.ts
          grep -q 'search_profiles' src/types/database.ts
          grep -q 'reserve_provider_requests' src/types/database.ts
          grep -q 'save_company_job_source' src/types/database.ts
          npm run typecheck

      - name: Use Deno 2
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verify Edge dependency graph and types
        shell: bash
        run: |
          set -euo pipefail
          deno cache --reload supabase/functions/daily-job-pull/index.ts \
            2>&1 | tee qa/job-discovery-v2-premerge/edge-cache.log
          deno check --reload supabase/functions/daily-job-pull/index.ts \
            2>&1 | tee qa/job-discovery-v2-premerge/edge-check.log
          deno info supabase/functions/daily-job-pull/index.ts \
            2>&1 | tee qa/job-discovery-v2-premerge/edge-dependency-graph.txt

      - name: Capture deterministic browser evidence
        shell: bash
        run: |
          set -euo pipefail
          npx --yes playwright@1.55.0 install --with-deps chromium
          mkdir -p qa/job-discovery-v2-premerge/screenshots
          for width in 390 768 1440; do
            npx --yes playwright@1.55.0 screenshot \
              --browser=chromium \
              --viewport-size="${width},1000" \
              --full-page \
              "file://${GITHUB_WORKSPACE}/tests/fixtures/discovery/control-center.html" \
              "qa/job-discovery-v2-premerge/screenshots/discovery-control-center-${width}.png"
          done

      - name: Restore permanent workflow and commit verified merge
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD^:.github/workflows/job-discovery-v2-verify.yml > .github/workflows/job-discovery-v2-verify.yml
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/job-discovery-v2-verify.yml')
          text = path.read_text()
          text = text.replace(
              'for version in 010 011 012 013 014 015 016 017; do',
              'for version in 010 011 012 013 014 015 016 017 018; do',
          )
          text = text.replace(
              '> qa/job-discovery-v2/database.generated.ts',
              '> qa/job-discovery-v2/database.generated.ts\n          cp qa/job-discovery-v2/database.generated.ts src/types/database.ts',
          )
          path.write_text(text)
          PY
          rm -f scripts/.pr10-payload-* scripts/run-pr10-remediation.py
          cat > qa/job-discovery-v2-premerge/REMEDIATION.md <<EOF
          # Job Discovery V2 Pre-Merge Remediation

          - Repaired PR8 base: \`f3ff18ed7d88b210ad166d363f31e4c446197ccc\`
          - Workflow run: \`${GITHUB_RUN_ID}\`
          - Migrations verified: \`010–018\`
          - Merge performed: \`no\`
          - Deployment performed: \`no\`
          - Feature deployment disabled: \`yes\`
          EOF
          git add -A
          git config user.name "harbourviewcompany-create"
          git config user.email "231706713+harbourviewcompany-create@users.noreply.github.com"
          git commit -m "fix: close Job Discovery V2 pre-merge blockers"
          git push origin HEAD:feat/job-discovery-v2

      - name: Upload remediation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-discovery-v2-premerge-${{ github.run_id }}
          path: qa/job-discovery-v2-premerge
          if-no-files-found: warn
          retention-days: 30
