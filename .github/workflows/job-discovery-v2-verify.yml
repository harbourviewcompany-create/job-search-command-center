name: Job Discovery V2 Verify

on:
  push:
    branches:
      - feat/job-discovery-v2
  pull_request:
    branches:
      - main
    paths:
      - 'shared/discovery/**'
      - 'src/app/settings/discovery/**'
      - 'src/components/discovery/**'
      - 'src/lib/discovery/**'
      - 'supabase/functions/_shared/discovery/**'
      - 'supabase/functions/_shared/providers/**'
      - 'supabase/functions/daily-job-pull/**'
      - 'supabase/migrations/01[0-7]_*.sql'
      - 'tests/discovery-v2.test.mjs'
      - 'tests/fixtures/discovery/**'
      - 'tests/fixtures/providers/**'
      - '.github/workflows/job-discovery-v2-verify.yml'

permissions:
  contents: read

concurrency:
  group: job-discovery-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Static, database, provider, and visual verification
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      pull-requests: read
      issues: write # Exact-head status reporting to the draft PR only.
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: discovery-verification-placeholder
      SUPABASE_SERVICE_ROLE_KEY: discovery-verification-placeholder
      JOB_PULL_API_KEY: discovery-verification-placeholder
      PGPASSWORD: postgres
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: discovery_verify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d discovery_verify"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout feature branch without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - id: install
        name: Install committed dependencies
        continue-on-error: true
        run: npm ci --no-audit --no-fund

      - id: typecheck
        name: Typecheck
        continue-on-error: true
        run: npm run typecheck

      - id: lint
        name: Lint
        continue-on-error: true
        run: npm run lint

      - id: tests
        name: Unit and provider fixture tests
        continue-on-error: true
        run: npm test

      - id: build
        name: Production build
        continue-on-error: true
        run: npm run build

      - id: migrations
        name: Apply production-shaped discovery migration chain
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa/job-discovery-v2
          psql -h 127.0.0.1 -U postgres -d discovery_verify \
            -v ON_ERROR_STOP=1 \
            -f tests/fixtures/discovery/baseline.sql \
            2>&1 | tee qa/job-discovery-v2/postgres-baseline.log

          for version in 010 011 012 013 014 015 016 017; do
            migration=$(find supabase/migrations -maxdepth 1 -type f -name "${version}_*.sql" -print)
            count=$(printf '%s\n' "$migration" | sed '/^$/d' | wc -l)
            if [ "$count" -ne 1 ]; then
              echo "Expected exactly one migration for ${version}; found ${count}" >&2
              exit 1
            fi
            echo "Applying ${migration}" | tee -a qa/job-discovery-v2/postgres-migrations.log
            psql -h 127.0.0.1 -U postgres -d discovery_verify \
              -v ON_ERROR_STOP=1 \
              -f "$migration" \
              2>&1 | tee -a qa/job-discovery-v2/postgres-migrations.log
          done

          psql -h 127.0.0.1 -U postgres -d discovery_verify \
            -v ON_ERROR_STOP=1 \
            -f tests/fixtures/discovery/assertions.sql \
            2>&1 | tee qa/job-discovery-v2/postgres-assertions.log

      - id: browser_install
        name: Install Chromium for screenshot evidence
        continue-on-error: true
        run: npx --yes playwright@1.55.0 install --with-deps chromium

      - id: screenshots
        name: Capture desktop and mobile discovery control center
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa/job-discovery-v2/screenshots
          npx --yes playwright@1.55.0 screenshot \
            --browser=chromium \
            --viewport-size="1440,1000" \
            --full-page \
            "file://${GITHUB_WORKSPACE}/tests/fixtures/discovery/control-center.html" \
            qa/job-discovery-v2/screenshots/discovery-control-center-desktop-1440.png
          npx --yes playwright@1.55.0 screenshot \
            --browser=chromium \
            --device="iPhone 13" \
            --full-page \
            "file://${GITHUB_WORKSPACE}/tests/fixtures/discovery/control-center.html" \
            qa/job-discovery-v2/screenshots/discovery-control-center-mobile-390.png

      - name: Write verification manifest
        if: always()
        shell: bash
        run: |
          mkdir -p qa/job-discovery-v2
          cat > qa/job-discovery-v2/VERIFICATION.md <<EOF
          # Job Discovery V2 Verification

          - Source commit: \`${GITHUB_SHA}\`
          - Workflow run: \`${GITHUB_RUN_ID}\`
          - Generated: \`$(date -u +'%Y-%m-%dT%H:%M:%SZ')\`
          - Branch deployment enabled: **false**
          - Merge performed: **no**
          - Production deployment performed: **no**

          ## Gate outcomes

          - npm ci: \`${{ steps.install.outcome }}\`
          - TypeScript: \`${{ steps.typecheck.outcome }}\`
          - ESLint: \`${{ steps.lint.outcome }}\`
          - Unit/provider tests: \`${{ steps.tests.outcome }}\`
          - Production build: \`${{ steps.build.outcome }}\`
          - PostgreSQL migrations/assertions: \`${{ steps.migrations.outcome }}\`
          - Chromium installation: \`${{ steps.browser_install.outcome }}\`
          - Desktop/mobile screenshots: \`${{ steps.screenshots.outcome }}\`
          EOF

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-discovery-v2-evidence-${{ github.sha }}
          path: qa/job-discovery-v2
          if-no-files-found: error
          retention-days: 30

      - name: Report exact-head result to draft PR
        if: always()
        uses: actions/github-script@v7
        env:
          INSTALL: ${{ steps.install.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          LINT: ${{ steps.lint.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          BUILD: ${{ steps.build.outcome }}
          MIGRATIONS: ${{ steps.migrations.outcome }}
          BROWSER_INSTALL: ${{ steps.browser_install.outcome }}
          SCREENSHOTS: ${{ steps.screenshots.outcome }}
        with:
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo
            const head = `${owner}:feat/job-discovery-v2`
            const pulls = await github.rest.pulls.list({ owner, repo, state: 'open', head })
            if (!pulls.data.length) return
            const fields = {
              install: process.env.INSTALL,
              typecheck: process.env.TYPECHECK,
              lint: process.env.LINT,
              tests: process.env.TESTS,
              build: process.env.BUILD,
              migrations: process.env.MIGRATIONS,
              browser_install: process.env.BROWSER_INSTALL,
              screenshots: process.env.SCREENSHOTS,
            }
            const passed = Object.values(fields).every(value => value === 'success')
            const marker = '<!-- job-discovery-v2-verification -->'
            const body = `${marker}\n## Job Discovery V2 exact-head verification\n\n` +
              `- Commit: \`${context.sha}\`\n` +
              `- Run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}\n` +
              `- Result: **${passed ? 'GO' : 'HOLD'}**\n` +
              Object.entries(fields).map(([name, value]) => `- ${name}: \`${value}\``).join('\n') +
              `\n- Merge performed: **no**\n- Deployment performed: **no**`
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number: pulls.data[0].number, per_page: 100 })
            const existing = comments.data.find(comment => comment.body?.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pulls.data[0].number, body })
            }

      - name: Enforce required gates
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          outcomes=(
            "${{ steps.install.outcome }}"
            "${{ steps.typecheck.outcome }}"
            "${{ steps.lint.outcome }}"
            "${{ steps.tests.outcome }}"
            "${{ steps.build.outcome }}"
            "${{ steps.migrations.outcome }}"
            "${{ steps.browser_install.outcome }}"
            "${{ steps.screenshots.outcome }}"
          )
          for outcome in "${outcomes[@]}"; do
            if [ "$outcome" != success ]; then
              echo "One or more required Job Discovery V2 gates failed." >&2
              exit 1
            fi
          done
