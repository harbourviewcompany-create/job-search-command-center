name: Stage Operator Boundary Workflow Updates

on:
  push:
    branches:
      - maintenance/pr8-operator-boundary
    paths:
      - .github/workflows/apply-operator-boundary-workflow-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4
        with:
          ref: maintenance/pr8-operator-boundary

      - name: Patch connected runtime workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/runtime-browser-verify.yml')
          text = path.read_text()

          replacements = [
            (
              "      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.RUNTIME_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || vars.RUNTIME_SUPABASE_ANON_KEY || vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}\n",
              "      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.RUNTIME_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || vars.RUNTIME_SUPABASE_ANON_KEY || vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}\n      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.RUNTIME_SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY || vars.RUNTIME_SUPABASE_SERVICE_ROLE_KEY || vars.SUPABASE_SERVICE_ROLE_KEY }}\n",
            ),
            (
              '          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then\n',
              '          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then\n',
            ),
            (
              '          node tests/runtime-browser-cleanup.mjs > /tmp/cleanup.log 2>&1\n',
              '          node tests/runtime-browser-cleanup-service.mjs > /tmp/cleanup.log 2>&1\n',
            ),
          ]

          for old, new in replacements:
            if old not in text:
              raise SystemExit(f'Expected workflow text not found: {old!r}')
            text = text.replace(old, new, 1)

          install_anchor = '''      - name: Typecheck
        id: typecheck
'''
          boundary_step = '''      - name: Verify database operator boundary
        id: operator_boundary
        shell: bash
        run: |
          if [ "${{ steps.install.outputs.exit_code }}" != "0" ]; then
            echo "Install failed; operator-boundary verification skipped." | tee /tmp/operator-boundary.log
            echo "exit_code=125" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          node tests/operator-boundary-verification.mjs > /tmp/operator-boundary.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat /tmp/operator-boundary.log
          exit 0

'''
          if install_anchor not in text:
            raise SystemExit('Typecheck anchor not found')
          text = text.replace(install_anchor, boundary_step + install_anchor, 1)

          text = text.replace(
            '            echo "| npm ci | ${{ steps.install.outputs.exit_code }} |"\n',
            '            echo "| npm ci | ${{ steps.install.outputs.exit_code }} |"\n            echo "| database operator boundary | ${{ steps.operator_boundary.outputs.exit_code }} |"\n',
            1,
          )
          text = text.replace(
            '            for entry in install typecheck lint tests build browser-install browser cleanup; do\n',
            '            for entry in install operator-boundary typecheck lint tests build browser-install browser cleanup; do\n',
            1,
          )
          text = text.replace(
            '            "${{ steps.install.outputs.exit_code }}"\n',
            '            "${{ steps.install.outputs.exit_code }}"\n            "${{ steps.operator_boundary.outputs.exit_code }}"\n',
            1,
          )

          path.write_text(text)
          PY

      - name: Commit helper-branch patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/runtime-browser-verify.yml
          git commit -m "test: enforce database boundary in connected runtime"
          git push origin HEAD:maintenance/pr8-operator-boundary
